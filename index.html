<!doctype html>
<html lang="en">
  <head>
    <title>POS Test Console</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"
      defer
    ></script>
    <style>
      :root {
        color-scheme: light;
        --ink: #253831;
        --muted: #67796f;
        --line: #dfe7e2;
        --accent: #176b51;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f7f9f8;
        color: var(--ink);
        font:
          14px "DM Sans",
          sans-serif;
        letter-spacing: 0;
      }
      button {
        font: inherit;
      }
      svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        stroke-width: 1.7;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      header {
        background: white;
        border-bottom: 1px solid var(--line);
      }
      .topbar {
        max-width: 1040px;
        margin: auto;
        padding: 20px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }
      .brand-icon {
        display: grid;
        place-items: center;
        width: 33px;
        height: 33px;
        background: #e6f2eb;
        border-radius: 7px;
        color: var(--accent);
      }
      .mode {
        color: var(--muted);
        font:
          11px ui-monospace,
          monospace;
      }
      main {
        max-width: 1040px;
        margin: auto;
        padding: 34px 30px 20px;
      }
      .page-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 29px;
      }
      h1 {
        font:
          800 27px/1.35 "Manrope",
          sans-serif;
      }
      .subtitle {
        margin-top: 7px;
        color: var(--muted);
        font-size: 12px;
      }
      .connection {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 10px;
        background: #fff3e6;
        border: 1px solid #f1dfc7;
        border-radius: 5px;
        color: #8c5b23;
        font-size: 11px;
        white-space: nowrap;
      }
      .connection::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .connection.available {
        color: var(--accent);
        background: #eaf5ee;
        border-color: #d4e6da;
      }
      .command-group {
        padding: 23px 0;
        border-top: 1px solid var(--line);
        animation: reveal 0.4s ease both;
      }
      .command-group:nth-of-type(2) {
        animation-delay: 0.06s;
      }
      .command-group:nth-of-type(3) {
        animation-delay: 0.12s;
      }
      .group-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .group-heading h2 {
        font:
          700 13px "Manrope",
          sans-serif;
      }
      .group-number {
        color: #87958d;
        font:
          11px ui-monospace,
          monospace;
      }
      .group-count {
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
      }
      .command-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .command-button {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 76px;
        padding: 14px 16px;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--ink);
        background: white;
        cursor: pointer;
        transition:
          transform 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease,
          background 0.18s ease;
      }
      .command-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .command-button:active {
        transform: translateY(1px) scale(0.985);
        background: #f0f6f2;
      }
      .button-icon {
        display: grid;
        place-items: center;
        flex: 0 0 36px;
        height: 36px;
        border-radius: 6px;
        background: #eaf4ee;
        color: #357252;
        transition: transform 0.2s ease;
      }
      .inputs .button-icon {
        background: #edf0fa;
        color: #6279a5;
      }
      .utilities .button-icon {
        background: #fbf1e5;
        color: #9b733d;
      }
      .button-label {
        display: block;
        min-width: 0;
      }
      .button-label strong {
        display: block;
        font-size: 12px;
        font-weight: 600;
      }
      .button-label small {
        display: block;
        margin-top: 5px;
        font:
          10px ui-monospace,
          monospace;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .button-arrow {
        margin-left: auto;
        width: 14px;
        height: 14px;
        color: #96a69b;
        transition:
          transform 0.18s ease,
          color 0.18s ease;
      }
      .command-button.danger {
        border-color: #ecd9d5;
      }
      .danger .button-icon {
        background: #fbeeea;
        color: #aa5d51;
      }
      .danger .button-label strong {
        color: #9a4c40;
      }
      .command-button.triggered {
        animation: command-pulse 0.5s ease;
      }
      .command-button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
        transform: none;
        box-shadow: none;
      }
      .command-button.loading {
        opacity: 1;
        cursor: wait;
        border-color: #8ab69d;
        background: #f0f8f3;
      }
      .loading .button-icon {
        position: relative;
        transform: none;
      }
      .loading .button-icon svg {
        visibility: hidden;
      }
      .loading .button-icon::after {
        content: "";
        position: absolute;
        width: 19px;
        height: 19px;
        border: 2px solid #176b5126;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
      }
      .loading .button-label small {
        color: var(--accent);
      }
      .loading .button-arrow {
        visibility: hidden;
      }
      .command-button.loading::after {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #76ae8f, transparent);
        background-size: 200% 100%;
        animation: loading-track 1.5s ease-in-out infinite;
      }
      .feedback {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 45px;
        border-top: 1px solid var(--line);
        padding: 13px 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .feedback svg {
        width: 16px;
        height: 16px;
      }
      .feedback.error {
        color: #9a4c40;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--line);
        padding: 16px 0;
        color: var(--muted);
        font-size: 10px;
      }
      @media (hover: hover) {
        .command-button:hover {
          transform: translateY(-2px);
          border-color: #a1bfac;
          box-shadow: 0 4px 10px #233e2e09;
        }
        .command-button:hover .button-icon {
          transform: scale(1.07);
        }
        .command-button:hover .button-arrow {
          transform: translateX(3px);
          color: var(--accent);
        }
        .command-button.danger:hover {
          border-color: #d79b8d;
          background: #fffaf8;
        }
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes command-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 #176b5100;
        }
        35% {
          box-shadow: 0 0 0 4px #176b5120;
        }
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes loading-track {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }
      @media (max-width: 760px) {
        .command-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .topbar {
          padding: 17px 20px;
        }
        main {
          padding: 25px 20px 12px;
        }
        .page-heading {
          align-items: flex-start;
          flex-wrap: wrap;
          gap: 14px;
          margin-bottom: 23px;
        }
        h1 {
          font-size: 24px;
        }
        .command-button {
          padding: 12px;
          gap: 9px;
        }
        .button-arrow {
          display: none;
        }
      }
      @media (max-width: 400px) {
        .topbar {
          padding: 15px 16px;
        }
        main {
          padding: 23px 16px 10px;
        }
        .command-button {
          gap: 8px;
          padding: 11px 9px;
        }
        .button-icon {
          flex-basis: 27px;
          height: 30px;
        }
        .button-icon svg {
          width: 17px;
          height: 17px;
        }
        .button-label strong {
          font-size: 11px;
        }
        .button-label small {
          font-size: 9px;
        }
        .mode {
          font-size: 10px;
        }
      }
      .command-dialog {
        width: 410px;
        max-width: calc(100% - 32px);
        max-height: calc(100dvh - 32px);
        padding: 28px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        box-shadow: none;
      }
      .command-dialog::backdrop {
        background: #ffffff80;
      }
      .command-dialog[open] {
        animation: reveal 0.25s ease both;
      }
      .loading-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .loading-heading code {
        font-size: 10px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .loading-live {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: var(--accent);
        white-space: nowrap;
      }
      .loading-live::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        animation: waiting-pulse 1.8s ease-in-out infinite;
      }
      .loading-visual {
        position: relative;
        display: grid;
        place-items: center;
        height: 174px;
        margin: 22px 0;
        border-radius: 6px;
        background:
          radial-gradient(#d4e4d9 0.7px, transparent 0.7px) 0 0 / 12px 12px,
          #f2f8f4;
        overflow: hidden;
      }
      .loading-scene {
        display: none;
      }
      [data-scene="signature"] .signature-scene,
      [data-scene="card"] .card-scene,
      [data-scene="input"] .input-scene,
      [data-scene="receipt"] .receipt-scene,
      [data-scene="symbol"] .symbol-scene {
        display: block;
      }
      .signature-scene {
        width: calc(100% - 20px);
        max-width: 320px;
        position: relative;
        aspect-ratio: 320 / 130;
      }
      .signature-art {
        display: block;
        width: 100%;
        height: 100%;
      }
      .signature-baseline {
        stroke: #c3d7c8;
        stroke-width: 1;
      }
      .signature-stroke {
        fill: none;
        stroke: #276e53;
        stroke-width: 2.3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .signature-pen {
        position: absolute;
        width: 25px;
        height: 25px;
        transform: translate(-3px, -22px);
        color: #32644e;
      }
      .signature-pen svg {
        width: 25px;
        height: 25px;
      }
      .card-scene {
        width: 168px;
        height: 135px;
        position: relative;
      }
      .reader-mouth {
        position: absolute;
        left: 13px;
        right: 13px;
        bottom: 16px;
        height: 32px;
        border-radius: 6px;
        background: #c6d8cd;
        border: 1px solid #a5bfad;
      }
      .reader-mouth::before {
        content: "";
        position: absolute;
        top: 11px;
        left: 14px;
        right: 14px;
        height: 6px;
        background: #325744;
        border-radius: 3px;
      }
      .waiting-card {
        position: absolute;
        left: 32px;
        top: 10px;
        width: 104px;
        height: 71px;
        padding: 13px;
        background: #296e54;
        border-radius: 6px;
        color: #eef8f1;
        box-shadow: 0 7px 14px #214d3020;
        animation: card-wait 2.4s ease-in-out infinite;
      }
      .waiting-card svg {
        width: 24px;
        height: 24px;
      }
      .card-marks {
        display: block;
        width: 49px;
        height: 4px;
        margin-top: 9px;
        border-radius: 2px;
        background: #a1c9b0;
      }
      .input-scene {
        width: 196px;
        text-align: center;
      }
      .input-symbol {
        display: inline-flex;
        color: #6279a5;
        margin-bottom: 16px;
      }
      .input-symbol svg {
        width: 26px;
        height: 26px;
      }
      .typing-field {
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 19px;
        background: white;
        border: 1px solid #cbd5e4;
        border-radius: 5px;
      }
      .typing-field span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7186b3;
        animation: typing-wait 1.6s ease-in-out infinite;
      }
      .typing-field span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing-field span:nth-child(3) {
        animation-delay: 0.3s;
      }
      .typing-field span:nth-child(4) {
        animation-delay: 0.45s;
      }
      .receipt-scene {
        position: relative;
        width: 116px;
        height: 132px;
      }
      .receipt-printer {
        position: absolute;
        left: 0;
        right: 0;
        top: 13px;
        height: 46px;
        background: #c8d6cf;
        border: 1px solid #afc3b7;
        border-radius: 7px;
      }
      .receipt-paper {
        position: absolute;
        width: 78px;
        height: 97px;
        top: 32px;
        left: 19px;
        padding: 17px 12px;
        border: 1px solid #d6ddd6;
        background: white;
        clip-path: polygon(
          0 0,
          100% 0,
          100% 94%,
          90% 100%,
          80% 94%,
          70% 100%,
          60% 94%,
          50% 100%,
          40% 94%,
          30% 100%,
          20% 94%,
          10% 100%,
          0 94%
        );
        animation: receipt-wait 2.6s ease-in-out infinite;
      }
      .receipt-paper span {
        display: block;
        height: 3px;
        margin-bottom: 10px;
        background: #b6c9ba;
      }
      .receipt-paper span:last-child {
        width: 60%;
      }
      .symbol-scene {
        color: #547a68;
      }
      .symbol-scene svg {
        width: 46px;
        height: 46px;
        stroke-width: 1.3;
        animation: symbol-wait 2s ease-in-out infinite;
      }
      .command-dialog[data-loading-action="requestTip"] .loading-visual {
        background-color: #fcf6ec;
      }
      .command-dialog[data-loading-action="requestTip"] .symbol-scene {
        color: #a98046;
      }
      .command-dialog[data-loading-action="cancel"] .symbol-scene {
        color: #aa5d51;
      }
      .loading-title {
        font:
          700 20px/1.4 "Manrope",
          sans-serif;
      }
      .loading-description {
        min-height: 38px;
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
      }
      .loading-footer {
        margin-top: 22px;
        padding-top: 17px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .loading-footer span {
        color: var(--muted);
        font-size: 10px;
      }
      .loading-cancel {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #e7cfc8;
        border-radius: 5px;
        padding: 9px 12px;
        background: white;
        color: #9a4c40;
        font-size: 12px;
        cursor: pointer;
      }
      .loading-cancel svg {
        width: 14px;
        height: 14px;
      }
      .loading-cancel:hover:not(:disabled) {
        background: #fff4ef;
      }
      .loading-cancel:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .loading-cancel:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      @keyframes waiting-pulse {
        50% {
          opacity: 0.35;
        }
      }
      @keyframes card-wait {
        0%,
        100% {
          transform: translateY(0) rotate(-5deg);
        }
        50% {
          transform: translateY(28px) rotate(0);
        }
      }
      @keyframes typing-wait {
        0%,
        70%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        35% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      @keyframes receipt-wait {
        0%,
        100% {
          transform: translateY(-14px);
        }
        65% {
          transform: translateY(0);
        }
      }
      @keyframes symbol-wait {
        50% {
          transform: translateY(-5px) rotate(-5deg);
        }
      }
      @media (max-width: 400px) {
        .command-dialog {
          padding: 21px;
        }
        .loading-title {
          font-size: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <script>
      const OperationType = {
        CANCEL: "CANCEL",
        ADD_NEW_TAB: "ADD_NEW_TAB",
        ALERT_MESSAGE: "ALERT_MESSAGE",
        READ_CARD: "READ_CARD",
        AUTH_CARD: "AUTH_CARD",
        READ_INPUT: "READ_INPUT",
        TIP_REQUEST: "TIP_REQUEST",
        READ_SIGNATURE: "READ_SIGNATURE",
        CONFIRM: "CONFIRM",
        MANUAL: "MANUAL",
        PRINT_RECEIPT: "PRINT_RECEIPT",
      };

      function onCommandCompletion(operationType, result) {
        completeCommandLoading(operationType);
        const responseMessage =
          "Operation Result : " + operationType + "\n" + JSON.stringify(result);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => alert(responseMessage));
        });
      }

      function cancel() {
        cic.postCommand(OperationType.CANCEL);
      }

      function addNewTab() {
        cic.postCommand(OperationType.ADD_NEW_TAB, getTabUrlPacket());
      }

      function toast() {
        cic.postCommand(OperationType.ALERT_MESSAGE, getToastPacket());
      }

      function readCard() {
        cic.postCommand(OperationType.READ_CARD, getReadCardPacket());
      }

      function getSignature() {
        cic.postCommand(OperationType.READ_SIGNATURE, getSignaturePacket());
      }

      function authCard() {
        cic.postCommand(OperationType.AUTH_CARD, getAuthCardPacket());
      }

      function readInputPhone() {
        cic.postCommand(OperationType.READ_INPUT, getReadInputPhonePacket());
      }
      function readInputAmount() {
        cic.postCommand(OperationType.READ_INPUT, getReadInputAmountPacket());
      }
      function readInputAvs() {
        cic.postCommand(OperationType.READ_INPUT, getReadInputAVSPacket());
      }
      function readInputDate() {
        cic.postCommand(OperationType.READ_INPUT, getReadInputDatePacket());
      }
      function readInputNumeric() {
        cic.postCommand(OperationType.READ_INPUT, getReadInputNUMERICPacket());
      }
      function readInputAlphaNumeric() {
        cic.postCommand(
          OperationType.READ_INPUT,
          getReadInputALPHANUMERICPacket(),
        );
      }

      function readConfirmation() {
        cic.postCommand(OperationType.CONFIRM, getReadConfirmPacket());
      }

      function requestTip() {
        cic.postCommand(OperationType.TIP_REQUEST, getTipPacket());
      }

      function readSignature() {
        cic.postCommand(OperationType.READ_SIGNATURE);
      }

      function authManual() {
        cic.postCommand(OperationType.MANUAL, getAuthManualPacket());
      }

      function printReceipt() {
        cic.postCommand(OperationType.PRINT_RECEIPT, getPrintReceiptPacket());
      }

      function getReadConfirmPacket() {
        return JSON.stringify({
          prompt: "Please confirm",
        });
      }

      function requestTip() {
        cic.postCommand(OperationType.TIP_REQUEST, getTipRequestPacket());
      }

      function getTipRequestPacket() {
        return JSON.stringify({
          prompt: "Choose tip",
          amount: "500",
          tipPercentPresets: [10, 15, 20],
        });
      }
      function getReadCardPacket() {
        return JSON.stringify({
          amount: "100",
        });
      }

      function getSignaturePacket() {
        return JSON.stringify({
          prompt: "Please sign",
        });
      }

      function getAuthCardPacket() {
        return JSON.stringify({
          amount: "200",
          invoiceId: "1232",
        });
      }

      /*
MMYY - Date Entry
    "MMYY" - response: "0516"
    Supported DATE FORMAT  MMYY , MMDDYY , MMDDYYYY
Nx[,y] - Numeric Entry
      x = minimum number of digits (if y not specified, user input length must match x)
      y = maximum number of digits (optional, max 32)
      Example 1
         "N5" - response: "19406"
      Example 2
         "N5,9" -
         response: "08081"
         or
         response: "080819876"
ANx[,y] - Alpha Numeric Entry
      x = minimum number of characters (if y not specified, user input length must match x)
      y = maximum number of characters (optional, max 32)
      Example 1
          "AN8" - response:  "A1B2C3D4"
      Example 2
         "AN1,99" -
         response: "A"
         or
         response: "A123"
*/
      const InputFormat = {
        AMOUNT: "AMOUNT",
        DATE: "MMDDYY",
        PHONE: "PHONE",
        NUMERIC: "N5",
        ALPHANUMERIC: "AN1",
      };

      function getReadInputPhonePacket() {
        return JSON.stringify({
          prompt: "Enter phone",
          format: InputFormat.PHONE,
        });
      }
      function getReadInputDatePacket() {
        return JSON.stringify({
          prompt: "Enter Date",
          format: InputFormat.DATE,
        });
      }
      function getReadInputAmountPacket() {
        return JSON.stringify({
          prompt: "Enter AMOUNT",
          format: InputFormat.AMOUNT,
        });
      }

      function getReadInputNUMERICPacket() {
        return JSON.stringify({
          prompt: "Enter NUMERIC",
          format: InputFormat.NUMERIC,
        });
      }
      function getReadInputALPHANUMERICPacket() {
        return JSON.stringify({
          prompt: "Enter ALPHANUMERIC",
          format: InputFormat.ALPHANUMERIC,
        });
      }

      function getTipPacket() {
        return JSON.stringify({
          amount: "1000",
          includeCustomTipAmount: "true",
          tipPercentPresets: [10, 15, 20],
        });
      }

      function getToastPacket() {
        return JSON.stringify({ msg: "Hello everyone..." });
      }

      function getTabUrlPacket() {
        return JSON.stringify({ url: "http://www.yahoo.com" });
      }

      function getPrintReceiptPacket() {
        return JSON.stringify({
          orderId: "C045UT22320014-20240610021737",
        });
      }

      function getAuthManualPacket() {
        return JSON.stringify({
          amount: "200",
          invoiceId: "1232",
        });
      }
    </script>

    <script>
      const commandOperations = {
        readCard: OperationType.READ_CARD,
        authCard: OperationType.AUTH_CARD,
        authManual: OperationType.MANUAL,
        getSignature: OperationType.READ_SIGNATURE,
        requestTip: OperationType.TIP_REQUEST,
        printReceipt: OperationType.PRINT_RECEIPT,
        readInputPhone: OperationType.READ_INPUT,
        readInputAmount: OperationType.READ_INPUT,
        readInputDate: OperationType.READ_INPUT,
        readInputNumeric: OperationType.READ_INPUT,
        readInputAlphaNumeric: OperationType.READ_INPUT,
        toast: OperationType.ALERT_MESSAGE,
        addNewTab: OperationType.ADD_NEW_TAB,
        readConfirmation: OperationType.CONFIRM,
        cancel: OperationType.CANCEL,
      };
      const loadingCommands = new Map();
      const loadingPresentations = {
        readCard: [
          "card",
          "Waiting for card",
          "Card read requested on the POS terminal.",
        ],
        authCard: [
          "card",
          "Authorizing card",
          "Waiting for the terminal authorization response.",
        ],
        authManual: [
          "input",
          "Manual authorization",
          "Waiting for manual entry on the POS terminal.",
        ],
        getSignature: [
          "signature",
          "Waiting for signature",
          "Signature capture is active on the POS terminal.",
        ],
        requestTip: [
          "symbol",
          "Waiting for tip selection",
          "Tip request is active on the POS terminal.",
        ],
        printReceipt: [
          "receipt",
          "Printing receipt",
          "Waiting for the terminal print response.",
        ],
        readInputPhone: [
          "input",
          "Waiting for phone number",
          "Phone entry is active on the POS terminal.",
        ],
        readInputAmount: [
          "input",
          "Waiting for amount",
          "Amount entry is active on the POS terminal.",
        ],
        readInputDate: [
          "input",
          "Waiting for date",
          "Date entry is active on the POS terminal.",
        ],
        readInputNumeric: [
          "input",
          "Waiting for numeric input",
          "Numeric entry is active on the POS terminal.",
        ],
        readInputAlphaNumeric: [
          "input",
          "Waiting for text input",
          "Alphanumeric entry is active on the POS terminal.",
        ],
        toast: [
          "symbol",
          "Sending ping",
          "Waiting for the terminal message response.",
        ],
        addNewTab: [
          "symbol",
          "Opening tab",
          "Waiting for the host tab response.",
        ],
        readConfirmation: [
          "symbol",
          "Waiting for confirmation",
          "Confirmation request is active on the POS terminal.",
        ],
        cancel: [
          "symbol",
          "Cancelling operation",
          "Cancellation requested. Waiting for the POS response.",
        ],
      };
      const motionPreference = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );
      let signatureAnimation;

      function animateWaitingSignature() {
        cancelAnimationFrame(signatureAnimation);
        const stroke = document.getElementById("signature-stroke");
        const pen = document.getElementById("signature-pen");
        const length = stroke.getTotalLength();
        const started = performance.now();
        function drawFrame(now) {
          const progress = motionPreference.matches
            ? 1
            : Math.min(((now - started) % 3800) / 2700, 1);
          const point = stroke.getPointAtLength(length * progress);
          stroke.style.strokeDashoffset = String(1 - progress);
          pen.style.left = (point.x / 320) * 100 + "%";
          pen.style.top = (point.y / 130) * 100 + "%";
          if (!motionPreference.matches)
            signatureAnimation = requestAnimationFrame(drawFrame);
        }
        drawFrame(started);
      }

      function syncLoadingDialog() {
        const dialog = document.getElementById("command-loading");
        const button =
          loadingCommands.get(OperationType.CANCEL) ||
          loadingCommands.values().next().value;
        cancelAnimationFrame(signatureAnimation);
        if (!button) {
          if (dialog.open) dialog.close();
          return;
        }
        const action = button.dataset.action;
        const [scene, title, description] = loadingPresentations[action];
        dialog.dataset.loadingAction = action;
        document.getElementById("loading-visual").dataset.scene = scene;
        document.getElementById("loading-title").textContent = title;
        document.getElementById("loading-description").textContent =
          description;
        document.getElementById("loading-operation").textContent =
          commandOperations[action];
        document.getElementById("loading-cancel").disabled =
          action === "cancel";
        const originalIcon =
          button.querySelector(".button-icon").firstElementChild;
        ["loading-symbol", "input-symbol"].forEach((id) => {
          document
            .getElementById(id)
            .replaceChildren(originalIcon.cloneNode(true));
        });
        if (window.lucide) window.lucide.createIcons();
        if (!dialog.open) dialog.showModal();
        if (scene === "signature") animateWaitingSignature();
      }

      function cancelLoadingOperation() {
        document.querySelector('[data-action="cancel"]').click();
      }

      document
        .getElementById("loading-cancel")
        .addEventListener("click", cancelLoadingOperation);
      document
        .getElementById("command-loading")
        .addEventListener("cancel", (event) => {
          event.preventDefault();
          cancelLoadingOperation();
        });
      motionPreference.addEventListener("change", () => {
        if (document.getElementById("command-loading").open)
          syncLoadingDialog();
      });

      function updateCommandButtons() {
        document.querySelectorAll("[data-action]").forEach((button) => {
          button.disabled =
            button.dataset.action === "cancel"
              ? loadingCommands.has(OperationType.CANCEL)
              : loadingCommands.size > 0;
        });
        syncLoadingDialog();
      }

      function stopCommandLoading(operationType) {
        const button = loadingCommands.get(operationType);
        if (!button) return;
        button.classList.remove("loading");
        button.removeAttribute("aria-busy");
        button.querySelector("small").textContent =
          button.dataset.originalDetail;
        loadingCommands.delete(operationType);
        updateCommandButtons();
      }

      function completeCommandLoading(operationType) {
        if (!loadingCommands.has(operationType)) return;
        const cancelling = loadingCommands.has(OperationType.CANCEL);
        if (cancelling) {
          Array.from(loadingCommands.keys()).forEach(stopCommandLoading);
        } else {
          stopCommandLoading(operationType);
        }
        document.getElementById("feedback").classList.remove("error");
        document.getElementById("feedback-message").textContent =
          operationType + " response received.";
      }

      function updateHostStatus() {
        const available =
          typeof cic !== "undefined" && typeof cic.postCommand === "function";
        const statusElement = document.getElementById("connection");
        statusElement.textContent = available
          ? "Host bridge available"
          : "Host bridge unavailable";
        statusElement.classList.toggle("available", available);
        return available;
      }

      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => {
          const feedback = document.getElementById("feedback");
          const message = document.getElementById("feedback-message");
          feedback.classList.remove("error");
          if (!updateHostStatus()) {
            feedback.classList.add("error");
            message.textContent =
              "Host bridge unavailable. Open this page in the POS Webview to send commands.";
            return;
          }
          const operationType = commandOperations[button.dataset.action];
          button.dataset.originalDetail =
            button.querySelector("small").textContent;
          button.querySelector("small").textContent = "Waiting for POS";
          button.classList.add("loading");
          button.setAttribute("aria-busy", "true");
          loadingCommands.set(operationType, button);
          updateCommandButtons();
          message.textContent =
            button.querySelector("strong").textContent +
            ": waiting for POS response.";
          try {
            window[button.dataset.action]();
            button.classList.remove("triggered");
            void button.offsetWidth;
            button.classList.add("triggered");
          } catch (error) {
            stopCommandLoading(operationType);
            feedback.classList.add("error");
            message.textContent =
              error instanceof Error ? error.message : String(error);
          }
        });
        button.addEventListener("animationend", () =>
          button.classList.remove("triggered"),
        );
      });

      window.addEventListener("focus", updateHostStatus);
      window.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) window.lucide.createIcons();
        updateHostStatus();
      });
      updateHostStatus();
    </script>
